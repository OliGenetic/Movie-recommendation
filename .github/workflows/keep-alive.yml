name: Keep Render Alive

on:
  schedule:
    # Запускать каждые 5 минут
    - cron: '*/5 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Bot
        run: curl -s https://movie-recommendation-664s.onrender.com/health > /dev/null
